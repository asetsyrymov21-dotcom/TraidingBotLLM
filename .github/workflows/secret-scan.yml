name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch complete history without traversing legacy gitlinks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-recurse-submodules origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Reject tracked environment and private key files
        shell: python
        run: |
          import pathlib, subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          allowed = {".env.example", ".env.sample", ".env.template"}
          forbidden = [
              name for name in files if name and (
                  (pathlib.PurePosixPath(name).name.startswith(".env")
                   and pathlib.PurePosixPath(name).name not in allowed)
                  or pathlib.PurePosixPath(name).suffix in {".key", ".p12", ".pfx"}
              )
          ]
          if forbidden:
              raise SystemExit("Secret-bearing file names tracked: " + ", ".join(forbidden))
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan every fetched commit
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact=100 --no-banner \
            --ignore-gitleaks-allow --log-opts="--all"
